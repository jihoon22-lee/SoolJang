# Tailscale serve 가 HTTPS 를 끝내고 평문으로 넘긴다. 앞단이 알려 준 원래 scheme 을 보존해야
# API 가 세션·CSRF 쿠키에 Secure 를 붙인다($scheme 은 항상 http 다).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 앞단(Tailscale)이 덧붙인 X-Forwarded-For 의 마지막 값이 실제 접속 주소다. 맨 앞 값은
# 클라이언트가 임의로 보낼 수 있어 로그인 제한 키로 쓰면 우회된다.
map $http_x_forwarded_for $client_addr {
    default                   $remote_addr;
    "~(?:^|,)\s*(?<last_hop>[^,\s]+)\s*$" $last_hop;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 개인 기록을 다루므로 기본 보안 헤더를 켠다.
    include /etc/nginx/snippets/security-headers.conf;

    # 해시가 붙은 자산은 장기 캐시, HTML 은 캐시하지 않는다. 배포 직후 오래된
    # index.html 이 새 자산을 참조하지 못하는 문제를 막는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 서비스워커는 절대 캐시하지 않는다. 캐시되면 업데이트가 전파되지 않는다.
    # SW에서 읽는 고정 이름의 push handler도 배포마다 다시 확인한다.
    location = /price-push.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 클라이언트가 보낸 X-Real-IP 는 덮어쓴다. API 는 이 값만 신뢰한다.
        proxy_set_header X-Real-IP $client_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 라벨 사진과 영수증 업로드를 고려한 크기다.
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
