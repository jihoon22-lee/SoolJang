# 모든 응답에 붙이는 보안 헤더. nginx 는 location 에 add_header 가 하나라도 있으면 server 수준
# add_header 를 상속하지 않으므로, add_header 를 쓰는 location 마다 이 파일을 다시 include 한다.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# 외부 출처 자료는 텍스트로만 렌더링한다. 스크립트·연결은 자기 출처만, 표제 글꼴만 Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
