[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sooljang"
version = "1.1.4"
description = "개인 주류 컬렉션 기록·관리·분석 플랫폼 (술장)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<2",
    # 비밀번호 해시. Argon2id 는 현재 권장되는 기본값이다.
    "argon2-cffi>=25.1,<26",
    # 외부 소스 어댑터(Task 18)의 HTML 파싱. CSS 셀렉터로 검색·상세 페이지를 읽는다.
    "beautifulsoup4>=4.15.0",
    # LLM API 키를 DB 에 암호화해 저장한다(Task 17). Fernet 대칭 암호화.
    # 46.x 에 알려진 취약점(GHSA-537c-gmf6-5ccf)이 있어 수정된 48.0.1 이상으로 고정한다.
    "cryptography>=48.0.1,<51",
    # pydantic EmailStr 이 요구한다. 이메일 형식 검증.
    "email-validator>=2.3,<3",
    "fastapi>=0.139.1,<1",
    # 외부 API 호출(Open Food Facts, OpenAI). Task 16 에서 이미 런타임에 쓰였으나
    # dev 그룹에만 있어 프로덕션 이미지에 누락돼 있었다 — 여기서 정정한다.
    "httpx>=0.28.1,<1",
    # Vision LLM 호출(라벨 OCR, Task 17). OpenAI 만 지원한다 — 다른 제공자 추상화는
    # 아직 필요가 없다.
    "openai>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    # FastAPI 의 multipart 업로드(레거시 CSV 임포트, 첨부파일, 라벨 사진)에 필요하다.
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.51.0,<1",
]

[project.scripts]
sooljang-api = "sooljang.api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.12,<1",
    "ty>=0.0.56,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sooljang"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# --timeout 은 교착 상태를 무한 대기 대신 스택이 남는 실패로 바꾼다.
addopts = "-ra --strict-markers --timeout=60 --timeout-method=thread --cov=sooljang --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "requires_db: 실제 PostgreSQL 연결이 필요한 테스트",
    "requires_legacy_sheet: 실제 레거시 시트 파일이 필요한 opt-in 테스트",
    "live_llm: 실제 LLM API 를 호출하는 opt-in 테스트",
    "benchmark: 대량 합성 데이터로 응답 시간을 측정하는 opt-in 테스트 (Task 21)",
]

[tool.coverage.run]
branch = true
source = ["sooljang"]
omit = ["src/sooljang/infrastructure/database/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
