[alembic]
script_location = src/sooljang/infrastructure/database/migrations
prepend_sys_path = src
path_separator = os
# 접속 URL 은 env.py 가 SOOLJANG_DATABASE_URL 에서 읽는다. 여기에 값을 두지 않는다.
sqlalchemy.url =

[post_write_hooks]
# console_scripts 타입은 alembic 프로세스 안에서 entrypoint 를 찾는데, ruff 는 별도
# 실행 파일로 설치되어 찾지 못한다. exec 타입으로 직접 실행한다.
hooks = ruff_lint,ruff_format
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
